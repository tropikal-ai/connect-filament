name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

# A new push supersedes the in-flight run for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the checkout.
permissions:
  contents: read

jobs:
  filament-compatibility:
    name: PHP ${{ matrix.php }} / Filament ${{ matrix.filament }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        filament: ["^3.2", "^4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer config repositories.connect vcs https://github.com/tropikal-ai/connect.git
      - run: composer require "tropikal-ai/connect:dev-codex/connector-chat-auto-injection as 0.2.0" --no-update
      - run: composer require "filament/filament:${{ matrix.filament }}" --no-update
      - run: composer update --with-all-dependencies --no-interaction --prefer-dist
      - run: composer test
      - run: composer analyse

  # The shared Connect-family quality gate (single source of CI truth).
  # Pinned to an immutable commit; Dependabot proposes the bumps.
  quality:
    uses: tropikal-ai/connect/.github/workflows/php-quality.yml@c7b27d5da27ffe24fb114b51d3c979d8be43291a
    with:
      pre-install: |
        composer config repositories.connect vcs https://github.com/tropikal-ai/connect.git
        composer require "tropikal-ai/connect:dev-codex/connector-chat-auto-injection as 0.2.0" --no-update

  # Single stable check for branch protection: "CI green" fails when any
  # quality job failed, was cancelled, or was skipped.
  ci:
    name: CI green
    if: always()
    needs: [quality, filament-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All quality jobs passed."
